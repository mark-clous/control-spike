<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control SPIKE Prime</title>
<style>
  body{font-family:Arial,sans-serif;text-align:center;background:#222;color:#fff;
       user-select:none;touch-action:manipulation}
  .grid-control{display:inline-grid;grid-template-columns:repeat(3,75px);gap:8px;margin:10px auto}
  button{width:75px;height:75px;font-size:24px;border-radius:12px;
         border:0;background:#4a90e2;color:#fff;font-weight:bold}
  button:active{background:#2c5f9e}
  .btn-diag{background:#357abd}
  
  #btn-disparo{background:#e74c3c;font-size:28px;box-shadow:0 4px 10px rgba(231,76,60,0.5)}
  #btn-disparo:active{background:#c0392b;transform:scale(0.95)}

  #conectar{width:auto;height:auto;font-size:18px;padding:12px 22px;background:#2e9e5b}
  #estado{min-height:1.5em}

  .panel-mecanismo{background:#333;border-radius:14px;padding:15px;margin:15px auto;max-width:320px}
  .mecanismo-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
  .btn-paso{width:60px;height:60px;font-size:28px;background:#ff9800;border-radius:10px;border:0;color:#fff;font-weight:bold}
  .btn-paso:active{background:#e68a00}
  
  .barra-contenedor{width:160px;background:#555;height:24px;border-radius:12px;overflow:hidden;position:relative}
  .barra-progreso{width:0%;height:100%;background:#4caf50;transition:width 0.15s ease-out}
  .barra-texto{position:absolute;width:100%;top:0;left:0;line-height:24px;font-size:12px;font-weight:bold;color:#fff}

  .panel-sensor{background:#2a2a3c;border-radius:14px;padding:15px;margin:15px auto;max-width:320px;border:1px solid #444}
  .valor-distancia{font-size:20px;font-weight:bold;margin:10px 0;padding:8px;border-radius:8px;background:#111}
  .en-rango{color:#2ecc71;border:1px solid #2ecc71}
  .fuera-rango{color:#e67e22;border:1px solid #e67e22}
  
  .btn-accion{width:100%;height:42px;font-size:14px;border-radius:8px;border:0;color:#fff;font-weight:bold;margin-top:6px;cursor:pointer}
  .btn-radar{background:#16a085} .btn-radar:active{background:#117864}
  .btn-auto{background:#9b59b6} .btn-auto:active{background:#8e44ad}

  .grupo-giros{display:flex;gap:8px;margin-top:6px;}
  .btn-giro-360{flex:1;height:40px;font-size:13px;background:#e67e22;border-radius:8px;border:0;color:#fff;font-weight:bold;cursor:pointer}
  .btn-giro-360:active{background:#d35400}
</style>
</head>
<body>
  <h2>Control SPIKE Prime</h2>
  <button id="conectar">Conectar hub</button>
  <p id="estado">Desconectado</p>

  <!-- Panel del Sensor de Distancia -->
  <div class="panel-sensor">
    <strong>Sensor Ultrasónico (Puerto C)</strong>
    <div id="distancia-display" class="valor-distancia fuera-rango">Midiendo...</div>
    <button id="btn-radar" class="btn-accion btn-radar">📡 Radar 360° (Buscar Objetivo)</button>
    
    <!-- Botones de Giro 360 Manual -->
    <div class="grupo-giros">
      <button id="btn-360-izq" class="btn-giro-360">↺ 360° Izq</button>
      <button id="btn-360-der" class="btn-giro-360">↻ 360° Der</button>
    </div>

    <button id="btn-autocalibrar" class="btn-accion btn-auto">⚡ Calibración Automática de Ángulo</button>
  </div>

  <div class="grid-control">
    <button class="btn-diag" data-c="I">↖</button>
    <button data-c="F">↑</button>
    <button class="btn-diag" data-c="D">↗</button>

    <button data-c="L">←</button>
    <button id="btn-disparo">🎯</button>
    <button data-c="R">→</button>

    <button class="btn-diag" data-c="G">↙</button>
    <button data-c="B">↓</button>
    <button class="btn-diag" data-c="H">↘</button>
  </div>

  <p>Velocidad Chasis: <input id="vel" type="range" min="1" max="9" value="5"></p>

  <div class="panel-mecanismo">
    <strong>Elevación Mecanismo (Puerto D)</strong>
    <div class="mecanismo-controls">
      <button class="btn-paso" id="btn-menos">-</button>
      
      <div class="barra-contenedor">
        <div id="barra-fill" class="barra-progreso"></div>
        <div id="barra-txt" class="barra-texto">0% (0°)</div>
      </div>

      <button class="btn-paso" id="btn-mas">+</button>
    </div>
  </div>

<script>
const SERVICE = "c5f50001-8280-46da-89f4-6d8051e4aeef";
const CHAR    = "c5f50002-8280-46da-89f4-6d8051e4aeef";
const estado  = document.getElementById("estado");
const distDisplay = document.getElementById("distancia-display");

let ch = null, cmd = "STOP_IDLE", busy = false, timer = null, corriendo = null;
let porcentajeMecanismo = 0;
let bloqueadoPorAccion = false;
let ultimaDistanciaMM = 0;
let bufferRecepción = "";

const esperar = ms => new Promise(r => setTimeout(r, ms));

function actualizarBarra() {
  const fill = document.getElementById("barra-fill");
  const txt = document.getElementById("barra-txt");
  fill.style.width = porcentajeMecanismo + "%";
  const grados = Math.round((porcentajeMecanismo / 100) * 480);
  txt.textContent = `${porcentajeMecanismo}% (${grados}°)`;
}

function procesarLecturaSerial(texto) {
  bufferRecepción += texto;
  let lineas = bufferRecepción.split("\n");
  bufferRecepción = lineas.pop();

  for (let linea of lineas) {
    linea = linea.trim();
    if (linea.startsWith("D:")) {
      const distMM = parseInt(linea.substring(2));
      if (!isNaN(distMM)) {
        ultimaDistanciaMM = distMM;
        actualizarTelemetriaDistancia(distMM);
      }
    }
  }
}

function actualizarTelemetriaDistancia(distMM) {
  if (distMM > 900) {
    distDisplay.textContent = "Fuera de cobertura (>90 cm)";
    distDisplay.className = "valor-distancia fuera-rango";
    return;
  }

  const cm = Math.round(distMM / 10);
  if (distMM >= 400 && distMM <= 750) {
    distDisplay.textContent = `Objetivo a: ${cm} cm (En Rango)`;
    distDisplay.className = "valor-distancia en-rango";
  } else {
    distDisplay.textContent = `Objetivo a: ${cm} cm (Fuera de rango)`;
    distDisplay.className = "valor-distancia fuera-rango";
  }
}

async function enviarComandoSimple(cmdTexto) {
  if (!ch) return;
  bloqueadoPorAccion = true;
  try {
    const msg = new TextEncoder().encode(cmdTexto);
    const data = new Uint8Array(msg.length + 1);
    data[0] = 0x06; data.set(msg, 1);
    await ch.writeValueWithResponse(data);
  } catch (err) { console.log(err); } 
  finally { await esperar(200); bloqueadoPorAccion = false; }
}

async function enviarComandoCalibracionAuto() {
  if (!ch) return;
  bloqueadoPorAccion = true;
  try {
    const msg = new TextEncoder().encode("A0");
    const data = new Uint8Array(msg.length + 1);
    data[0] = 0x06; data.set(msg, 1);
    await ch.writeValueWithResponse(data);

    if (ultimaDistanciaMM >= 400 && ultimaDistanciaMM <= 750) {
      porcentajeMecanismo = Math.round(((ultimaDistanciaMM - 400) / 350) * 100);
      actualizarBarra();
    }
  } catch (err) { console.log(err); } 
  finally { await esperar(200); bloqueadoPorAccion = false; }
}

async function enviarComandoMecanismo(pct) {
  if (!ch) return;
  bloqueadoPorAccion = true;
  try {
    const nivel = Math.round(pct / 10);
    const charNivel = String.fromCharCode(97 + nivel);
    const msg = new TextEncoder().encode("C" + charNivel);
    const data = new Uint8Array(msg.length + 1);
    data[0] = 0x06; data.set(msg, 1);
    await ch.writeValueWithResponse(data);
  } catch (err) {} 
  finally { await esperar(150); bloqueadoPorAccion = false; }
}

// Eventos de botones
document.getElementById("btn-disparo").onclick = () => enviarComandoSimple("S0");
document.getElementById("btn-radar").onclick = () => enviarComandoSimple("T0");
document.getElementById("btn-360-izq").onclick = () => enviarComandoSimple("Q0");
document.getElementById("btn-360-der").onclick = () => enviarComandoSimple("E0");
document.getElementById("btn-autocalibrar").onclick = () => enviarComandoCalibracionAuto();

document.getElementById("btn-menos").onclick = () => {
  if (porcentajeMecanismo > 0) {
    porcentajeMecanismo = Math.max(0, porcentajeMecanismo - 10);
    actualizarBarra();
    enviarComandoMecanismo(porcentajeMecanismo);
  }
};

document.getElementById("btn-mas").onclick = () => {
  if (porcentajeMecanismo < 100) {
    porcentajeMecanismo = Math.min(100, porcentajeMecanismo + 10);
    actualizarBarra();
    enviarComandoMecanismo(porcentajeMecanismo);
  }
};

async function conectarConReintentos(dev) {
  for (let i = 1; i <= 5; i++) {
    try {
      estado.textContent = `Conectando... (intento ${i}/5)`;
      if (dev.gatt.connected) dev.gatt.disconnect();
      await esperar(500);
      const server = await dev.gatt.connect();
      await esperar(1000);
      const svc = await server.getPrimaryService(SERVICE);
      return await svc.getCharacteristic(CHAR);
    } catch (e) { await esperar(1500); }
  }
  throw new Error("No se pudo conectar tras 5 intentos");
}

document.getElementById("conectar").onclick = async () => {
  try {
    clearInterval(timer);
    corriendo = null;

    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }]
    });
    dev.addEventListener("gattserverdisconnected", () => {
      estado.textContent = "Desconectado";
      distDisplay.textContent = "Sin conexión";
      distDisplay.className = "valor-distancia fuera-rango";
      clearInterval(timer);
      ch = null;
    });

    ch = await conectarConReintentos(dev);

    ch.addEventListener("characteristicvaluechanged", e => {
      const d = new Uint8Array(e.target.value.buffer);
      if (d[0] === 0x00 && d.length >= 5) {
        const flags = d[1] | (d[2] << 8) | (d[3] << 16) | (d[4] << 24);
        corriendo = !!(flags & (1 << 6));
      }
      if (d[0] === 0x01 || d[0] === 0x06) {
        procesarLecturaSerial(new TextDecoder().decode(d.slice(1)));
      }
    });
    await ch.startNotifications();
    await esperar(1000);

    if (corriendo === false) {
      estado.textContent = "Iniciando programa...";
      await ch.writeValueWithResponse(new Uint8Array([0x01]));
      await esperar(2000);
    }

    estado.textContent = "Conectado ✔";

    timer = setInterval(async () => {
      if (busy || !ch || bloqueadoPorAccion || cmd === "STOP_IDLE") return;
      busy = true;
      try {
        const vel = document.getElementById("vel").value;
        const msg = new TextEncoder().encode(cmd + vel);
        const data = new Uint8Array(msg.length + 1);
        data[0] = 0x06; data.set(msg, 1);
        await ch.writeValueWithResponse(data);
      } catch (err) {}
      busy = false;
    }, 100);

  } catch (err) { estado.textContent = "Error: " + err.message; }
};

document.querySelectorAll(".grid-control button[data-c]").forEach(b => {
  b.addEventListener("pointerdown", () => cmd = b.dataset.c);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
    b.addEventListener(ev, () => cmd = "STOP_IDLE"));
});
</script>
</body>
</html>
