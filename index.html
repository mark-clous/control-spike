<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control SPIKE Prime</title>
<style>
  body{font-family:Arial,sans-serif;text-align:center;background:#222;color:#fff;
       user-select:none;touch-action:manipulation}
  .grid-control{display:inline-grid;grid-template-columns:repeat(3,75px);gap:8px;margin:10px auto}
  button{width:75px;height:75px;font-size:24px;border-radius:12px;
         border:0;background:#4a90e2;color:#fff;font-weight:bold}
  button:active{background:#2c5f9e}
  .btn-diag{background:#357abd}
  #btn-stop{background:#d9534f}
  #conectar{width:auto;height:auto;font-size:18px;padding:12px 22px;background:#2e9e5b}
  #estado{min-height:1.5em}

  .panel-mecanismo{background:#333;border-radius:14px;padding:15px;margin:15px auto;max-width:320px}
  .mecanismo-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
  .btn-paso{width:60px;height:60px;font-size:28px;background:#ff9800;border-radius:10px;border:0;color:#fff;font-weight:bold}
  .btn-paso:active{background:#e68a00}
  
  .barra-contenedor{width:160px;background:#555;height:24px;border-radius:12px;overflow:hidden;position:relative}
  .barra-progreso{width:0%;height:100%;background:#4caf50;transition:width 0.15s ease-out}
  .barra-texto{position:absolute;width:100%;top:0;left:0;line-height:24px;font-size:12px;font-weight:bold;color:#fff}
</style>
</head>
<body>
  <h2>Control SPIKE Prime</h2>
  <button id="conectar">Conectar hub</button>
  <p id="estado">Desconectado</p>

  <div class="grid-control">
    <button class="btn-diag" data-c="I">↖</button>
    <button data-c="F">↑</button>
    <button class="btn-diag" data-c="D">↗</button>

    <button data-c="L">←</button>
    <button id="btn-stop" data-c="S">■</button>
    <button data-c="R">→</button>

    <button class="btn-diag" data-c="G">↙</button>
    <button data-c="B">↓</button>
    <button class="btn-diag" data-c="H">↘</button>
  </div>

  <p>Velocidad Chasis: <input id="vel" type="range" min="1" max="9" value="5"></p>

  <div class="panel-mecanismo">
    <strong>Elevación Mecanismo (Puerto D)</strong>
    <div class="mecanismo-controls">
      <button class="btn-paso" id="btn-menos">-</button>
      
      <div class="barra-contenedor">
        <div id="barra-fill" class="barra-progreso"></div>
        <div id="barra-txt" class="barra-texto">0% (0°)</div>
      </div>

      <button class="btn-paso" id="btn-mas">+</button>
    </div>
  </div>

<script>
const SERVICE = "c5f50001-8280-46da-89f4-6d8051e4aeef";
const CHAR    = "c5f50002-8280-46da-89f4-6d8051e4aeef";
const estado  = document.getElementById("estado");

let ch = null, cmd = "S", busy = false, timer = null, corriendo = null;
let porcentajeMecanismo = 0;
let bloqueadoPorMecanismo = false; // Pausa el envío constante de chasis para dar prioridad

const esperar = ms => new Promise(r => setTimeout(r, ms));

function actualizarBarra() {
  const fill = document.getElementById("barra-fill");
  const txt = document.getElementById("barra-txt");
  fill.style.width = porcentajeMecanismo + "%";
  const grados = Math.round((porcentajeMecanismo / 100) * 480);
  txt.textContent = `${porcentajeMecanismo}% (${grados}°)`;
}

async function enviarComandoMecanismo(pct) {
  if (!ch) return;
  bloqueadoPorMecanismo = true; // Bloquea temporalmente el envío de comandos de chasis
  try {
    const nivel = Math.round(pct / 10); // 0 a 10
    const charNivel = String.fromCharCode(97 + nivel); // 'a' hasta 'k'
    const msg = new TextEncoder().encode("C" + charNivel);
    const data = new Uint8Array(msg.length + 1);
    data[0] = 0x06;
    data.set(msg, 1);
    
    // Forzar reintentos de envío en caso de colisión Bluetooth
    await ch.writeValueWithResponse(data);
  } catch (err) { 
    console.log("Error enviando mecanismo:", err); 
  } finally {
    await esperar(150); // Pequeña pausa para asegurar la recepción en el Hub
    bloqueadoPorMecanismo = false;
  }
}

document.getElementById("btn-menos").onclick = () => {
  if (porcentajeMecanismo > 0) {
    porcentajeMecanismo = Math.max(0, porcentajeMecanismo - 10);
    actualizarBarra();
    enviarComandoMecanismo(porcentajeMecanismo);
  }
};

document.getElementById("btn-mas").onclick = () => {
  if (porcentajeMecanismo < 100) {
    porcentajeMecanismo = Math.min(100, porcentajeMecanismo + 10);
    actualizarBarra();
    enviarComandoMecanismo(porcentajeMecanismo);
  }
};

async function conectarConReintentos(dev) {
  for (let i = 1; i <= 5; i++) {
    try {
      estado.textContent = `Conectando... (intento ${i}/5)`;
      if (dev.gatt.connected) dev.gatt.disconnect();
      await esperar(500);
      const server = await dev.gatt.connect();
      await esperar(1000);
      const svc = await server.getPrimaryService(SERVICE);
      return await svc.getCharacteristic(CHAR);
    } catch (e) {
      console.log("Intento", i, e);
      await esperar(1500);
    }
  }
  throw new Error("No se pudo conectar tras 5 intentos");
}

document.getElementById("conectar").onclick = async () => {
  try {
    clearInterval(timer);
    corriendo = null;

    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }]
    });
    dev.addEventListener("gattserverdisconnected", () => {
      estado.textContent = "Desconectado";
      clearInterval(timer);
      ch = null;
    });

    ch = await conectarConReintentos(dev);

    ch.addEventListener("characteristicvaluechanged", e => {
      const d = new Uint8Array(e.target.value.buffer);
      if (d[0] === 0x00 && d.length >= 5) {
        const flags = d[1] | (d[2] << 8) | (d[3] << 16) | (d[4] << 24);
        corriendo = !!(flags & (1 << 6));
      }
    });
    await ch.startNotifications();
    await esperar(1000);

    if (corriendo === false) {
      estado.textContent = "Iniciando programa del hub...";
      await ch.writeValueWithResponse(new Uint8Array([0x01]));
      await esperar(2000);
    }

    estado.textContent = "Conectado ✔";

    // Enviar comandos del chasis 10 veces por segundo si no hay orden de mecanismo
    timer = setInterval(async () => {
      if (busy || !ch || bloqueadoPorMecanismo) return;
      busy = true;
      try {
        const vel = document.getElementById("vel").value;
        const msg = new TextEncoder().encode(cmd + vel);
        const data = new Uint8Array(msg.length + 1);
        data[0] = 0x06;
        data.set(msg, 1);
        await ch.writeValueWithResponse(data);
      } catch (err) { console.log(err); }
      busy = false;
    }, 100);

  } catch (err) {
    estado.textContent = "Error: " + err.message;
  }
};

document.querySelectorAll(".grid-control button[data-c]").forEach(b => {
  b.addEventListener("pointerdown", () => cmd = b.dataset.c);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
    b.addEventListener(ev, () => cmd = "S"));
});
</script>
</body>
</html>
