<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control SPIKE Prime</title>
<style>
  body{font-family:Arial,sans-serif;text-align:center;background:#222;color:#fff;
       user-select:none;touch-action:manipulation}
  button{width:90px;height:90px;font-size:30px;margin:5px;border-radius:14px;
         border:0;background:#4a90e2;color:#fff}
  button:active{background:#2c5f9e}
  #conectar{width:auto;height:auto;font-size:18px;padding:12px 22px;background:#2e9e5b}
  #estado{min-height:1.5em}
</style>
</head>
<body>
  <h2>Control SPIKE Prime</h2>
  <button id="conectar">Conectar hub</button>
  <p id="estado">Desconectado</p>

  <div><button data-c="F">↑</button></div>
  <div>
    <button data-c="L">←</button>
    <button data-c="S">■</button>
    <button data-c="R">→</button>
  </div>
  <div><button data-c="B">↓</button></div>

  <p>Velocidad: <input id="vel" type="range" min="1" max="9" value="5"></p>

<script>
const SERVICE = "c5f50001-8280-46da-89f4-6d8051e4aeef";
const CHAR    = "c5f50002-8280-46da-89f4-6d8051e4aeef";
const estado  = document.getElementById("estado");

let ch = null, cmd = "S", busy = false, timer = null, corriendo = null;
const esperar = ms => new Promise(r => setTimeout(r, ms));

async function conectarConReintentos(dev) {
  for (let i = 1; i <= 5; i++) {
    try {
      estado.textContent = `Conectando... (intento ${i}/5)`;
      if (dev.gatt.connected) dev.gatt.disconnect();
      await esperar(500);
      const server = await dev.gatt.connect();
      await esperar(1000);                       // dar tiempo a Windows
      const svc = await server.getPrimaryService(SERVICE);
      return await svc.getCharacteristic(CHAR);
    } catch (e) {
      console.log("Intento", i, e);
      await esperar(1500);
    }
  }
  throw new Error("No se pudo conectar tras 5 intentos");
}

document.getElementById("conectar").onclick = async () => {
  try {
    clearInterval(timer);
    corriendo = null;

    const dev = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE] }]
    });
    dev.addEventListener("gattserverdisconnected", () => {
      estado.textContent = "Desconectado";
      clearInterval(timer);
      ch = null;
    });

    ch = await conectarConReintentos(dev);

    ch.addEventListener("characteristicvaluechanged", e => {
      const d = new Uint8Array(e.target.value.buffer);
      if (d[0] === 0x00 && d.length >= 5) {            // estado del hub
        const flags = d[1] | (d[2] << 8) | (d[3] << 16) | (d[4] << 24);
        corriendo = !!(flags & (1 << 6));              // bit 6 = programa corriendo
      } else if (d[0] === 0x01) {                      // print() del hub
        console.log("HUB:", new TextDecoder().decode(d.slice(1)));
      }
    });
    await ch.startNotifications();
    await esperar(1000);

    if (corriendo === false) {                         // iniciar programa guardado
      estado.textContent = "Iniciando programa del hub...";
      await ch.writeValueWithResponse(new Uint8Array([0x01]));
      await esperar(2000);
    }

    estado.textContent = "Conectado ✔ (programa corriendo: " + corriendo + ")";

    // Enviar el comando 10 veces por segundo
    timer = setInterval(async () => {
      if (busy || !ch) return;
      busy = true;
      try {
        const vel = document.getElementById("vel").value;
        const msg = new TextEncoder().encode(cmd + vel);
        const data = new Uint8Array(msg.length + 1);
        data[0] = 0x06;                                // WRITE_STDIN
        data.set(msg, 1);
        await ch.writeValueWithResponse(data);
      } catch (err) { console.log(err); }
      busy = false;
    }, 100);

  } catch (err) {
    estado.textContent = "Error: " + err.message;
  }
};

// Botones (mouse y táctil): se activan al presionar y paran al soltar
document.querySelectorAll("button[data-c]").forEach(b => {
  b.addEventListener("pointerdown", () => cmd = b.dataset.c);
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev =>
    b.addEventListener(ev, () => cmd = "S"));
});

// Teclado: flechas o W A S D (espacio = stop)
const keymap = {ArrowUp:"F", w:"F", ArrowDown:"B", s:"B",
                ArrowLeft:"L", a:"L", ArrowRight:"R", d:"R", " ":"S"};
document.addEventListener("keydown", e => { if (keymap[e.key]) cmd = keymap[e.key]; });
document.addEventListener("keyup",   e => { if (keymap[e.key]) cmd = "S"; });
</script>
</body>
</html>
